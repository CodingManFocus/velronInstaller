name: Installer checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse POSIX installer
        run: sh -n install.sh
      - name: Lint POSIX installer
        run: shellcheck -s sh install.sh
      - name: Check help
        run: sh install.sh --help

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows architecture with PowerShell 7
        shell: pwsh
        run: ./installer/tests/testWindowsArchitecture.ps1
      - name: Check Windows architecture with Windows PowerShell 5.1
        shell: powershell
        run: ./installer/tests/testWindowsArchitecture.ps1
